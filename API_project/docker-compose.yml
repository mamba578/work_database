services:
  db:
    image: mysql:8.0
    container_name: azure_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 0305ramazan
      MYSQL_DATABASE: azure
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dump_azure.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure_api
    restart: always
    ports:
      - "5050:8080"
    depends_on:
      - db
    volumes:
      - ./Images:/app/Images
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=server=db;port=3306;database=azure;user=root;password=0305ramazan;"

volumes:
  mysql_data: